<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pool</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #info[hidden]{display:none}
  #info{position:fixed;left:calc(var(--rim) * 1.2);bottom:calc(var(--rim) * 1.2);color:#0c2a33;opacity:.75;
    font:400 max(10px,1.4vh)/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;pointer-events:none;
    background:rgba(240,246,248,.9);padding:.5em .8em;border-radius:3px}
  #info b{font-weight:600}
  #info span:not(:empty){margin-left:1.2em}
  #qrbox{position:fixed;right:calc(var(--rim) * 1.2);bottom:calc(var(--rim) * 1.2);display:flex;flex-direction:column;align-items:center;gap:.8vh;
    background:rgba(240,246,248,.94);padding:1vh;border-radius:4px;pointer-events:none}
  #qr{width:9vh;height:9vh;display:none;image-rendering:pixelated}
  #qrcap{color:#0c2a33;font:400 max(9px,1.2vh)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;opacity:.8}
  @media (max-width:640px){ #qrbox{display:none} }
  #err{position:fixed;inset:0;display:none;place-items:center;color:#5fc8e0;font:16px ui-monospace,monospace}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info" hidden><span id="count"></span></div>
<div id="qrbox"><canvas id="qr"></canvas><div id="qrcap">touch the pool</div></div>
<div id="err">this display can't run WebGL</div>
<script src="../config.js"></script>
<script src="../lib.js"></script>
<script>window.POOL_EMBED = /*POOL_DATA*/null;</script>
<script>
/* ============================================================
   POOL — the pool.  Lampwrecked.
   100 editions, ten seconds of touch each, stored on Ethereum
   and replayed in order, two seconds apart (never more than five
   in the water at once), as currents and ripples. A full pool
   cycles every 200 seconds; with fewer editions they repeat in
   order, at the same pace, so the pool is never sparse. Plankton light
   up only where the water is sheared, and tire where it has been
   stirred too much. Overhead lamps mirror on the surface so you
   can see every wave slosh off the walls.
   ============================================================ */

// ---- SETTINGS -------------------------------------------------
// The contract address lives in /config.js (shared with /input/).
// Where the QR code sends people. Empty = this site's /input/ page.
const TOUCH_URL = '';
// ---------------------------------------------------------------

const qs = new URLSearchParams(location.search);
const LOW = qs.get('q') === 'low';
const SHOW_UI = qs.get('ui') !== '0';

const P = {
  // one version everywhere: full quality on phone and TV (?q=low only if you ask for it)
  simRes: LOW ? 96 : 160,         // currents
  lightRes: LOW ? 320 : 768,      // plankton excitation field
  waveRes: LOW ? 240 : 448,       // water surface
  particles: LOW ? 256 : 512,     // plankton = particles² (512² ≈ 262k)
  bloomRes: LOW ? 180 : 360,
  pressureIters: LOW ? 16 : 24,
  margin: 0.035,                  // deck width, as a share of the short side
  depth: 0.72,                    // how small the floor looks (smaller = deeper pool)
  lampCount: 40,                  // ceiling lamps (arranged in a grid)
  velDissipation: 0.35,           // how fast currents calm
  curl: 18,                       // curly, organic eddies
  threshold: 7.0,                 // shear needed before plankton light up
  gain: 8.0,                      // light per unit stimulus
  lightDecay: 1.5,                // afterglow fade (per second)
  recover: 0.055,                 // charge recovery per second (~20s)
  deplete: 0.9,                   // how much each flash tires the water
  waveSpeed: 0.42,                // ripple speed (keep under 0.5)
  waveDamp: 0.9975,               // how long ripples keep sloshing
  waveForce: 0.3,                 // how much gestures make waves
  slope: 4.0,                     // how strongly ripples bend the light
  lamps: 2.4,                     // brightness of the lamp reflections
  plankton: 1.5,                  // brightness of plankton
  bloom: 0.9,
  force: 1.0,                     // global gesture force
};

// ================= WebGL setup =================
const canvas = document.getElementById('c');
let gl, ext;
(function init() {
  const params = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: qs.get('test') === '1' };
  gl = canvas.getContext('webgl2', params);
  const isGL2 = !!gl;
  if (!gl) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
  if (!gl) { document.getElementById('err').style.display = 'grid'; throw new Error('no webgl'); }
  let halfFloat, linear, cbf = null;
  if (isGL2) { cbf = gl.getExtension('EXT_color_buffer_float'); linear = gl.getExtension('OES_texture_float_linear') || gl.getExtension('OES_texture_half_float_linear'); }
  else { halfFloat = gl.getExtension('OES_texture_half_float'); linear = gl.getExtension('OES_texture_half_float_linear'); gl.getExtension('OES_texture_float'); }
  const type = isGL2 ? gl.HALF_FLOAT : (halfFloat && halfFloat.HALF_FLOAT_OES);
  const fmt = isGL2 ? { internal: gl.RGBA16F, format: gl.RGBA } : { internal: gl.RGBA, format: gl.RGBA };
  ext = { isGL2, type, fmt, linear: !!linear };
  if (!type || !canRender(fmt.internal, fmt.format, type)) {
    ext.type = gl.UNSIGNED_BYTE; ext.fmt = { internal: gl.RGBA, format: gl.RGBA }; ext.byteMode = true; ext.linear = true;
  }
  // particle positions want full 32-bit floats so slow drift isn't rounded away
  ext.pos = { type: ext.type, fmt: ext.fmt };
  if (isGL2 && cbf && canRender(gl.RGBA32F, gl.RGBA, gl.FLOAT)) ext.pos = { type: gl.FLOAT, fmt: { internal: gl.RGBA32F, format: gl.RGBA } };
  else if (!isGL2 && gl.getExtension('WEBGL_color_buffer_float') && canRender(gl.RGBA, gl.RGBA, gl.FLOAT)) ext.pos = { type: gl.FLOAT, fmt: { internal: gl.RGBA, format: gl.RGBA } };
  ext.vtf = gl.getParameter(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS) > 1 && !ext.byteMode;
})();
function canRender(internal, format, type) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, 4, 4, 0, format, type, null);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteTexture(t); gl.deleteFramebuffer(f);
  return ok;
}

// ================= shaders =================
const VS = `
precision highp float;
attribute vec2 aPos;
varying vec2 vUv, vL, vR, vT, vB;
uniform vec2 texel;
void main(){
  vUv = aPos*0.5+0.5;
  vL = vUv - vec2(texel.x,0.); vR = vUv + vec2(texel.x,0.);
  vT = vUv + vec2(0.,texel.y); vB = vUv - vec2(0.,texel.y);
  gl_Position = vec4(aPos,0.,1.);
}`;
// plankton: one point per particle, positioned from the particle texture
const VS_PART = `
precision highp float; precision highp sampler2D;
attribute vec2 aPos;               // this particle's address in the particle texture
uniform sampler2D uPos, uLight;
uniform vec4 pool; uniform float time, psize;
varying float vB; varying float vSeed;
void main(){
  vec4 p = texture2D(uPos, aPos);
  float l = texture2D(uLight, p.xy).r;
  float fl = 0.5 + 0.5*sin(time*(2.5 + p.z*9.0) + p.z*80.0);
  vB = smoothstep(0.02, 0.55, l) * (0.35 + 0.65*fl) * (0.55 + 0.9*fract(p.z*13.7));
  vSeed = p.z;
  vec2 s = pool.xy + p.xy*pool.zw;
  gl_Position = vB < 0.004 ? vec4(3.,3.,3.,1.) : vec4(s*2.0-1.0, 0., 1.);
  gl_PointSize = psize*(0.7 + 1.6*vB);
}`;
const HEAD = `precision highp float; precision highp sampler2D;
varying vec2 vUv, vL, vR, vT, vB;
`;
const FS = {
  splat: `${HEAD}
uniform sampler2D uTarget; uniform float aspect; uniform vec3 color; uniform vec2 point; uniform float radius;
void main(){
  vec2 p = vUv - point; p.x *= aspect;
  vec3 s = exp(-dot(p,p)/radius) * color;
  vec4 base = texture2D(uTarget,vUv);
  gl_FragColor = vec4(base.xyz + s, base.w);
}`,
  advect: `${HEAD}
uniform sampler2D uVelocity, uSource; uniform vec2 texel, dyeTexel; uniform float dt, dissipation;
#ifdef MANUAL
vec4 bilerp(sampler2D s, vec2 uv, vec2 ts){
  vec2 st = uv/ts - 0.5; vec2 i = floor(st); vec2 f = fract(st);
  vec4 a = texture2D(s,(i+vec2(.5,.5))*ts), b = texture2D(s,(i+vec2(1.5,.5))*ts);
  vec4 c = texture2D(s,(i+vec2(.5,1.5))*ts), d = texture2D(s,(i+vec2(1.5,1.5))*ts);
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
#endif
void main(){
#ifdef MANUAL
  vec2 coord = vUv - dt*bilerp(uVelocity,vUv,texel).xy*texel;
  vec4 r = bilerp(uSource,coord,dyeTexel);
#else
  vec2 coord = vUv - dt*texture2D(uVelocity,vUv).xy*texel;
  vec4 r = texture2D(uSource,coord);
#endif
  gl_FragColor = r / (1.0 + dissipation*dt);
}`,
  divergence: `${HEAD}
uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uVelocity,vL).x, R = texture2D(uVelocity,vR).x;
  float T = texture2D(uVelocity,vT).y, B = texture2D(uVelocity,vB).y;
  vec2 C = texture2D(uVelocity,vUv).xy;
  if(vL.x<0.) L=-C.x; if(vR.x>1.) R=-C.x; if(vT.y>1.) T=-C.y; if(vB.y<0.) B=-C.y;
  gl_FragColor = vec4(0.5*(R-L+T-B),0.,0.,1.);
}`,
  curl: `${HEAD}
uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uVelocity,vL).y, R = texture2D(uVelocity,vR).y;
  float T = texture2D(uVelocity,vT).x, B = texture2D(uVelocity,vB).x;
  gl_FragColor = vec4(0.5*(R-L-T+B),0.,0.,1.);
}`,
  vorticity: `${HEAD}
uniform sampler2D uVelocity, uCurl; uniform float curl, dt;
void main(){
  float L = texture2D(uCurl,vL).x, R = texture2D(uCurl,vR).x, T = texture2D(uCurl,vT).x, B = texture2D(uCurl,vB).x;
  float C = texture2D(uCurl,vUv).x;
  vec2 f = 0.5*vec2(abs(T)-abs(B), abs(R)-abs(L));
  f /= length(f)+0.0001; f *= curl*C; f.y *= -1.;
  vec2 v = texture2D(uVelocity,vUv).xy + f*dt;
  gl_FragColor = vec4(clamp(v,-1000.,1000.),0.,1.);
}`,
  clear: `${HEAD}
uniform sampler2D uTexture; uniform float value;
void main(){ gl_FragColor = value*texture2D(uTexture,vUv); }`,
  pressure: `${HEAD}
uniform sampler2D uPressure, uDivergence;
void main(){
  float L = texture2D(uPressure,vL).x, R = texture2D(uPressure,vR).x, T = texture2D(uPressure,vT).x, B = texture2D(uPressure,vB).x;
  float d = texture2D(uDivergence,vUv).x;
  gl_FragColor = vec4((L+R+B+T-d)*0.25,0.,0.,1.);
}`,
  gradient: `${HEAD}
uniform sampler2D uPressure, uVelocity;
void main(){
  float L = texture2D(uPressure,vL).x, R = texture2D(uPressure,vR).x, T = texture2D(uPressure,vT).x, B = texture2D(uPressure,vB).x;
  vec2 v = texture2D(uVelocity,vUv).xy - vec2(R-L,T-B);
  // solid pool walls: no flow through the edges
  if(vL.x<0. || vR.x>1.) v.x = 0.; if(vB.y<0. || vT.y>1.) v.y = 0.;
  gl_FragColor = vec4(v,0.,1.);
}`,
  // bioluminescence: shear excites plankton; light needs charge; charge tires and recovers
  lumen: `${HEAD}
uniform sampler2D uVelocity, uLight; uniform vec2 vtexel; uniform float dt, threshold, gain, decay, recover, deplete;
void main(){
  vec2 ex = vec2(vtexel.x,0.), ey = vec2(0.,vtexel.y);
  vec2 r = texture2D(uVelocity,vUv+ex).xy, l = texture2D(uVelocity,vUv-ex).xy;
  vec2 t = texture2D(uVelocity,vUv+ey).xy, b = texture2D(uVelocity,vUv-ey).xy;
  float dudx = 0.5*(r.x-l.x), dvdy = 0.5*(t.y-b.y), dudy = 0.5*(t.x-b.x), dvdx = 0.5*(r.y-l.y);
  float shear = sqrt((dudx-dvdy)*(dudx-dvdy) + (dudy+dvdx)*(dudy+dvdx));
  float vort = abs(dvdx-dudy);
  float strain = shear + 0.6*vort;
  float stim = smoothstep(threshold, threshold*5.0, strain);
  vec4 L = texture2D(uLight,vUv);
  float charge = L.g;
  float emit = stim * charge * gain * dt;
  float light = L.r * exp(-decay*dt) + emit;
  charge = clamp(charge + recover*dt*(1.0-charge) - emit*deplete, 0.0, 1.0);
  gl_FragColor = vec4(min(light,6.0), charge, 0., 1.);
}`,
  // water surface: wave equation, R = height now, G = height before. Edges reflect = sloshing.
  wave: `${HEAD}
uniform sampler2D uWave; uniform vec2 texel; uniform float c2, damp;
void main(){
  vec2 s = texture2D(uWave,vUv).rg;
  float L = texture2D(uWave,clamp(vL,texel*.5,1.-texel*.5)).r, R = texture2D(uWave,clamp(vR,texel*.5,1.-texel*.5)).r;
  float T = texture2D(uWave,clamp(vT,texel*.5,1.-texel*.5)).r, B = texture2D(uWave,clamp(vB,texel*.5,1.-texel*.5)).r;
  float lap = L+R+T+B-4.0*s.r;
  float h = (2.0*s.r - s.g + c2*lap) * damp;
  h = mix(h, (L+R+T+B)*0.25, 0.012);       // a touch of softening so it never rings forever
  gl_FragColor = vec4(clamp(h,-8.,8.), s.r, 0., 1.);
}`,
  // plankton drift with the currents; old ones quietly re-seed elsewhere
  partInit: `${HEAD}
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
void main(){
  vec2 c = gl_FragCoord.xy;
  gl_FragColor = vec4(hash(c), hash(c+17.13), hash(c+51.7), hash(c+3.9)*20.0);
}`,
  partStep: `${HEAD}
uniform sampler2D uPos, uVelocity; uniform vec2 vtexel; uniform float dt, time;
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
void main(){
  vec4 p = texture2D(uPos, vUv);
  vec2 v = texture2D(uVelocity, p.xy).xy;
  p.xy += dt * v * vtexel;
  p.w += dt;
  float life = 14.0 + 22.0*fract(p.z*7.31);
  if (p.w > life || p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0) {
    vec2 k = vUv*917.0 + fract(time*0.137)*311.0;
    p = vec4(hash(k), hash(k+19.7), p.z, 0.0);
  }
  gl_FragColor = p;
}`,
  partFS: `precision highp float;
varying float vB; varying float vSeed;
uniform float gain;
void main(){
  vec2 q = gl_PointCoord - 0.5;
  float d = length(q);
  float a = smoothstep(0.5, 0.0, d);
  vec3 c = mix(vec3(0.08,0.55,1.0), vec3(0.55,0.97,1.0), smoothstep(0.35,1.2,vB)) * vB * a * gain;
  gl_FragColor = vec4(c, 1.0);
}`,
  bright: `${HEAD}
uniform sampler2D uTexture;
void main(){ gl_FragColor = vec4(texture2D(uTexture,vUv).rgb, 1.); }`,
  blur: `${HEAD}
uniform sampler2D uTexture; uniform vec2 dir;
void main(){
  vec3 c = texture2D(uTexture,vUv).rgb*0.227;
  c += texture2D(uTexture,vUv+dir*1.385).rgb*0.316; c += texture2D(uTexture,vUv-dir*1.385).rgb*0.316;
  c += texture2D(uTexture,vUv+dir*3.231).rgb*0.07;  c += texture2D(uTexture,vUv-dir*3.231).rgb*0.07;
  gl_FragColor = vec4(c,1.);
}`,
  // the room: white glossy deck, coping, perspective walls down to a deep floor, lamp grid mirrored on the water
  display: `${HEAD}
uniform sampler2D uWave, uParts, uBloom, uLight;
uniform sampler2D uText; uniform vec3 textInfo; // lettering: columns, rows, first tile row
uniform vec4 pool; uniform vec2 res, wtexel, lampGrid; uniform float time, bloomAmt, slope, lamps, poolAspect, usePart, rim, depthScale;
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
// x = tile (1) vs grout (0), y = per-tile variation, z = bevel, w = tile id hash 2
vec4 tiles(vec2 c, float grout){
  vec2 id = floor(c); vec2 f = fract(c);
  vec2 e = min(f, 1.0-f);
  float m = smoothstep(0.0, grout, min(e.x,e.y));
  float bevel = (f.x - f.y)*0.25*smoothstep(grout*3.0, 0.0, min(e.x,e.y));
  return vec4(m, hash(id), bevel, hash(id+7.7));
}
// grid of round ceiling lamps over the pool (pool units: x 0..A, y 0..1). soft = glossiness blur
float lampsAt(vec2 c, float soft){
  vec2 cell = vec2(poolAspect, 1.0) / lampGrid;
  vec2 g = clamp(floor(c/cell), vec2(0.0), lampGrid-1.0);
  float e = 0.0;
  for (int i=-1;i<=1;i++) for (int j=-1;j<=1;j++){
    vec2 gg = g + vec2(float(i),float(j));
    if (gg.x < 0.0 || gg.y < 0.0 || gg.x > lampGrid.x-1.0 || gg.y > lampGrid.y-1.0) continue;
    vec2 lp = (gg + 0.5)*cell;
    float r = 0.15*min(cell.x, cell.y);
    float d = length(c - lp);
    e += smoothstep(r*(1.0+soft*2.5), r*(0.82-soft*0.5), d) * (4.2 - soft*3.2);
    e += exp(-d*d/(r*r*9.0)) * 0.12;            // halo: crests catch light everywhere
  }
  return e;
}
void main(){
  vec2 px = vUv*res;
  vec2 pmin = pool.xy*res, pmax = (pool.xy+pool.zw)*res;
  float dEdge = min(min(px.x-pmin.x, pmax.x-px.x), min(px.y-pmin.y, pmax.y-px.y)); // >0 water, <0 deck
  float A = poolAspect;
  vec2 p = (vUv - pool.xy)/pool.zw;                   // pool uv (can be outside 0..1 on the deck)
  vec2 w = vec2(p.x*A, p.y);                          // pool units
  vec3 col = vec3(0.0);
  vec3 bloom = texture2D(uBloom, vUv).rgb;
  float glowLight = dot(bloom, vec3(0.3,0.5,0.2));
  float tilePx = rim*0.58;

  if (dEdge < 0.0) {
    // ---- white glossy deck ----
    vec4 t = tiles((px - pmin)/tilePx + 0.5, 0.035);
    vec3 white = vec3(0.86,0.9,0.92) * (0.93 + 0.1*t.y) * (1.0 + t.z);
    col = mix(vec3(0.62,0.66,0.68), white, t.x) * 1.15;
    vec2 tilt = (vec2(t.w, t.y) - 0.5) * 0.02;        // each tile sits a hair off-flat
    col += vec3(1.0) * lampsAt(w + tilt*4.0, 0.7) * 0.22 * t.x;
    // coping: rounded white bullnose right at the water
    float cw = rim*0.42;
    if (-dEdge < cw) {
      float u = -dEdge/cw;                                 // 0 at water, 1 at deck
      float round = sin(u*1.5708);
      vec3 cop = vec3(0.92,0.95,0.96) * (0.55 + 0.5*round);
      cop += smoothstep(0.55, 0.7, u) * smoothstep(0.85, 0.7, u) * 0.35; // highlight along the nose
      col = mix(cop, col, smoothstep(0.92, 1.0, u));
    }
    col += vec3(0.05,0.4,0.7) * glowLight * 0.6;
  } else {
    // ---- water ----
    vec2 pc = clamp(p, wtexel, 1.0-wtexel);
    float h0 = texture2D(uWave, pc).r;
    float hL = texture2D(uWave, pc - vec2(wtexel.x,0.)).r, hR = texture2D(uWave, pc + vec2(wtexel.x,0.)).r;
    float hB = texture2D(uWave, pc - vec2(0.,wtexel.y)).r, hT = texture2D(uWave, pc + vec2(0.,wtexel.y)).r;
    vec2 grad = vec2(hR-hL, hT-hB) * slope;
    float lap = (hL+hR+hB+hT-4.0*h0) * slope;
    vec3 N = normalize(vec3(-grad, 1.0));

    // looking down into the basin: walls in perspective, floor deep below
    vec2 q = (vec2(p.x-0.5, p.y-0.5) + grad*0.006) * vec2(A, 1.0);  // refracted, centred, pool units
    vec2 half_ = vec2(A, 1.0)*0.5;
    vec2 kk = abs(q)/half_;
    float k = max(kk.x, kk.y);
    float s = depthScale;                        // how small the floor looks = how deep it is
    float cam = 1.0, D = cam/s - cam;
    vec3 tileCol; float z;
    float tileSize = 1.0/34.0;
    if (k <= s) {
      // floor
      vec2 fw = q/s;
      z = D;
      vec4 t = tiles(fw/tileSize, 0.07);
      tileCol = mix(vec3(0.45,0.5,0.52), vec3(0.9,0.94,0.95)*(0.94+0.1*t.y), t.x);
      // lane lines down the long axis
      float across = (A >= 1.0) ? fw.y : fw.x;
      float along  = (A >= 1.0) ? fw.x : fw.y;
      float span = (A >= 1.0) ? 1.0 : A;
      float lanes = 8.0;
      float lc = fract(across/span*lanes + 0.5*lanes) - 0.5;
      float len = ((A >= 1.0) ? A : 1.0)*0.5 - 0.09;
      float line = smoothstep(0.026, 0.016, abs(lc)) * step(abs(along), len);
      line = max(line, smoothstep(0.035, 0.022, abs(lc)) * step(abs(abs(along)-len), 0.012) * 0.0);
      float tee = step(abs(abs(along)-len), 0.006) * smoothstep(0.09, 0.07, abs(lc));

      if (Math.random() < 0.5) { const a = Math.random() * 6.283, r = 0.006 + 0.03 * grow * pl.h;
        splat(x + Math.cos(a) * r / aspect(), y + Math.sin(a) * r, Math.cos(a + 1.2) * 120 * G * (0.4 + grow), Math.sin(a + 1.2) * 120 * G * (0.4 + grow), 0.7 + grow); }
      if (Math.random() < 0.08) wave(x, y, (0.25 + 0.6 * grow) * G, 1.0 + grow);
    }
    // paths: currents along every finger
    for (const f of g.f) {
      for (let i = 3; i < f.length; i += 3) {
        const ta = f[i - 3], tb = f[i];
        if (tb <= prev || tb > t) continue;
        const [x0, y0] = mapPt(pl, f[i - 2], f[i - 1]), [x1, y1] = mapPt(pl, f[i + 1], f[i + 2]);
        const sec = Math.max(0.012, (tb - ta) / 1000);
        let vx = (x1 - x0) / sec, vy = (y1 - y0) / sec;
        const sp = Math.hypot(vx * aspect(), vy);
        const cap = 3.5; if (sp > cap) { vx *= cap / sp; vy *= cap / sp; }
        const dist = Math.hypot((x1 - x0) * aspect(), y1 - y0);
        const n = Math.max(1, Math.min(6, Math.ceil(dist / 0.012)));
        const mult = (g.t === 4 ? 1.5 : 1) * G * 260;
        for (let j = 0; j < n; j++) {
          const u = (j + 0.5) / n;
          splat(x0 + (x1 - x0) * u, y0 + (y1 - y0) * u, vx * mult / Math.sqrt(n), vy * mult / Math.sqrt(n), 1.0);
        }
        wave((x0 + x1) / 2, (y0 + y1) / 2, Math.min(sp, 2.5) * 0.32 * G * (g.t === 4 ? 1.4 : 1), 1.0);
      }
    }
    // shape-level events at the end of the gesture
    if (t >= pl.dur && !pl.ended) {
      pl.ended = true;
      if (g.t === 5 || g.t === 7) { // swirl / rotate: leave a vortex at the centroid, spin = direction drawn
        const f = g.f[0]; let cx = 0, cy = 0, n = 0, turn = 0;
        for (let i = 0; i < f.length; i += 3) { cx += f[i + 1]; cy += f[i + 2]; n++; }
        cx /= n; cy /= n;
        for (let i = 6; i < f.length; i += 3) {
          const a1 = Math.atan2(f[i - 1] - f[i - 4], f[i - 2] - f[i - 5]), a2 = Math.atan2(f[i + 2] - f[i - 1], f[i + 1] - f[i - 2]);
          let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; turn += d;
        }
        if (g.t === 7 && g.f[1]) { // rotation sign from two fingers
          const a = g.f[0], b = g.f[1];
          const s0 = Math.atan2(b[2] - a[2], b[1] - a[1]), s1 = Math.atan2(b[b.length - 1] - a[a.length - 1], b[b.length - 2] - a[a.length - 2]);
          turn = s1 - s0;
        }
        const [x, y] = mapPt(pl, cx, cy);
        vortex(x, y, 0.035 * pl.h, (turn > 0 ? -1 : 1) * 220 * G); // y flips screen→uv
        wave(x, y, -1.4 * G, 2.2); // a whirlpool dimple
      }
      if (g.t === 6 && g.f[1]) { // pinch in / spread out
        const a = g.f[0], b = g.f[1];
        const d0 = Math.hypot(b[1] - a[1], b[2] - a[2]), d1 = Math.hypot(b[b.length - 2] - a[a.length - 2], b[b.length - 1] - a[a.length - 1]);
        const cx = (a[a.length - 2] + b[b.length - 2]) / 2, cy = (a[a.length - 1] + b[b.length - 1]) / 2;
        const [x, y] = mapPt(pl, cx, cy);
        ring(x, y, 0.04 * pl.h, (d1 > d0 ? 1 : -1) * 300 * G, 14);
        wave(x, y, (d1 > d0 ? 1.5 : -1.5) * G, 2.0);
      }
    }
    pl.last = t;
    if (t > pl.dur + 400) players.splice(k, 1);
  }
}

// ================= the 100 editions =================
// Each edition is a 10-second session (many strokes). A new one starts every 2 seconds, so at most
// five are ever in the water. A full pool cycles every 200 seconds; with fewer editions they repeat
// in order at the same pace, seamlessly (2 editions: #1 #2 #1 #2 …). A single token's
// page plays its one gesture every 10 seconds instead. The cycle is tied to the real clock: every
// screen and every token page shows the same moment.
const CFG = window.POOL_CONFIG || {}, L = window.POOLLIB;
const EMBED = window.POOL_EMBED;                         // set when this page is a token, served from the chain
const chainMode = !EMBED && !!(CFG.contract && L);
const focus = (EMBED && EMBED.token) || parseInt(qs.get('token')) || 0;   // this edition glows brighter
let editions = [];                                        // [{ id, a, strokes:[{t,start,f}] }]
const countEl = document.getElementById('count');
function setCount() { countEl.textContent = (focus ? '#' + focus + '  ·  ' : '') + editions.length + ' / 100'; }

// reads every edition each time, so rewritten gestures show up too
async function loadEditions() {
  try {
    const n = await L.totalSupply(), next = [];
    for (let from = 1; from <= n; from += 25) {
      const list = await L.readGestures(from, 25);
      list.forEach((b, i) => { const d = L.decode(b); if (d) next[from + i - 1] = { id: from + i, ...d }; });
    }
    editions = next.filter(Boolean);
    setCount();
  } catch (e) { console.warn('pool: could not read the chain', e); }
}

// demo: invented 10-second sessions so the pool can be seen before anything is minted
function synthSession(id) {
  const strokes = []; let t = 0;
  const r = mulberry(id * 77 + 5);
  while (t < 9000) {
    const g = synth(); const d = g.f.reduce((m, f) => Math.max(m, f[f.length - 3]), 0);
    strokes.push({ t: g.t, start: t, f: g.f }); t += d + 150 + r() * 1100;
  }
  return { id, a: 0.462, strokes };
}

const SLOT = 2000;                                       // a new edition every 2 s
const SOLO = !!(EMBED && EMBED.ids && EMBED.ids.length === 1);   // one token's page: its gesture alone
let lastSlot = null;
const wallBase = Date.now() - performance.now();
function scheduleEditions(now) {
  if (!editions.length) return;
  const wall = wallBase + now;                           // same moment on every screen
  const slot = Math.floor(wall / SLOT);
  if (lastSlot === null) {                               // joining mid-cycle: start the ones already running
    for (let back = 5; back >= 0; back--) startEdition(slot - back, (slot - back) * SLOT - wall);
  } else for (let s = lastSlot + 1; s <= slot; s++) startEdition(s, s * SLOT - wall);
  lastSlot = slot;
}
function startEdition(slot, offsetMs) {
  if (SOLO && ((slot % 5) + 5) % 5) return;             // one token: every 10 s, never overlapping itself
  const n = editions.length, ed = editions[((slot % n) + n) % n]; if (!ed) return;
  const reg = region(ed.a, ed.id * 1013 + 7, false);
  const mine = focus && ed.id === focus;
  for (const st of ed.strokes) {
    const delay = st.start + offsetMs;
    if (delay < 0) continue;                              // already under way when we joined
    play({ t: st.t, a: ed.a * 1000, f: st.f }, mine, { delay, reg, gain: mine ? 1.6 : (focus ? 0.75 : 1.0), tag: ed.id });
  }
}

// same-browser preview from /input/ (demo + "preview before minting")
try { new BroadcastChannel('pool').onmessage = (e) => {
  const m = e.data;
  if (m && m.session) { const d = L && L.decode(new Uint8Array(m.session)); if (d) for (const st of d.strokes) play({ t: st.t, a: d.a * 1000, f: st.f }, true, { delay: st.start }); }
  else play(m, true);
}; } catch (e) { }

// invented gestures for demo mode
function synth() {
  const types = [0, 0, 1, 2, 3, 3, 3, 4, 4, 5, 5, 6, 7, 8, 9];
  const t = types[(Math.random() * types.length) | 0];
  const f = [], pts = (fn, n, dt) => { const a = []; for (let i = 0; i < n; i++) { const p = fn(i / (n - 1)); a.push(Math.round(i * dt), Math.round(p[0]), Math.round(p[1])); } return a; };
  const cx = rand(250, 750), cy = rand(250, 750), ang = rand(0, 6.28);
  if (t === 0 || t === 1) f.push([0, cx | 0, cy | 0, 90, cx | 0, cy | 0]);
  if (t === 2) f.push(pts(() => [cx + rand(-3, 3), cy + rand(-3, 3)], 40, 60));
  if (t === 3 || t === 4) { const L = rand(200, 500), n = t === 4 ? 6 : 30, bend = rand(-0.6, 0.6);
    f.push(pts(u => [cx + Math.cos(ang + bend * u) * L * (u - .5), cy + Math.sin(ang + bend * u) * L * (u - .5)], n, t === 4 ? 25 : 40)); }
  if (t === 5) { const R = rand(80, 200), turns = rand(1.2, 3), dir = Math.random() < .5 ? 1 : -1;
    f.push(pts(u => [cx + Math.cos(ang + dir * u * turns * 6.28) * R * (1 - u * .3), cy + Math.sin(ang + dir * u * turns * 6.28) * R * (1 - u * .3)], 60, 30)); }
  if (t === 6) { const s = Math.random() < .5 ? 1 : -1, d0 = s > 0 ? 60 : 260, d1 = s > 0 ? 300 : 50;
    for (const k of [1, -1]) f.push(pts(u => [cx + Math.cos(ang) * k * (d0 + (d1 - d0) * u), cy + Math.sin(ang) * k * (d0 + (d1 - d0) * u)], 20, 30)); }
  if (t === 7) { const R = rand(90, 180), sw = rand(1, 2) * (Math.random() < .5 ? 1 : -1);
    for (const k of [0, Math.PI]) f.push(pts(u => [cx + Math.cos(ang + k + sw * u) * R, cy + Math.sin(ang + k + sw * u) * R], 24, 30)); }
  if (t === 8) { const L = rand(200, 400); for (const k of [-40, 40]) f.push(pts(u => [cx + Math.cos(ang) * L * (u - .5) - Math.sin(ang) * k, cy + Math.sin(ang) * L * (u - .5) + Math.cos(ang) * k], 25, 35)); }
  if (t === 9) for (let k = 0; k < 4; k++) { const ox = rand(-120, 120), oy = rand(-120, 120), dx = rand(-150, 150), dy = rand(-150, 150);
    f.push(pts(u => [cx + ox + dx * u, cy + oy + dy * u], 20, 35)); }
  return { t, a: 462, f };
}

// a barely-there ambient drift: below the glow threshold, keeps the water alive between visitors
let nextDrift = 0;
function drift(now) {
  if (now < nextDrift) return;
  splat(rand(0, 1), rand(0, 1), rand(-1, 1) * 14, rand(-1, 1) * 14, 6);
  nextDrift = now + rand(1500, 4000);
}

// ================= QR =================
function drawQR() {
  if (!SHOW_UI || window.POOL_EMBED) { document.getElementById('qrbox').style.display = 'none'; document.getElementById('info').style.display = 'none'; return; }
  const url = TOUCH_URL || new URL('../input/', location.href.split('?')[0]).href;
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  s.onload = () => {
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    const n = q.getModuleCount(), cv = document.getElementById('qr'), px = 8;
    cv.width = cv.height = n * px; const c = cv.getContext('2d');
    c.fillStyle = '#f0f6f8'; c.fillRect(0, 0, n * px, n * px); c.fillStyle = '#0c2a33';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) c.fillRect(k * px, r * px, px, px);
    cv.style.display = 'block';
  };
  s.onerror = () => { document.getElementById('qrcap').textContent = url.replace(/^https?:\/\//, ''); };
  document.head.appendChild(s);
}
drawQR();

// ================= loop =================
if (EMBED) { editions = (EMBED.gestures || []).map((b64, i) => { const d = L.decode(L.b64ToBytes(b64)); return d && { id: (EMBED.ids && EMBED.ids[i]) || i + 1, ...d }; }).filter(Boolean); }
else if (chainMode) { loadEditions(); setInterval(loadEditions, 30000); }
else { editions = Array.from({ length: 100 }, (_, i) => synthSession(i + 1)); setCount(); countEl.textContent += '  ·  demo'; }
addEventListener('keydown', e => {
  if (e.key === 'f') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => { });
  if (e.key === 'g') play(synth(), true); // test: drop a "live" gesture
});
addEventListener('dblclick', () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => { }));

// one clock for everything, so a test run can step time exactly
let simNow = performance.now(), lastT = simNow;
const TEST = qs.get('test') === '1';
function frame(now) {
  simNow = now;
  const dt = Math.min((now - lastT) / 1000, 1 / 30); lastT = now;
  resize();
  scheduleEditions(now); drift(now); updatePlayers(now);
  step(dt, now / 1000);
  if (!TEST) { render(now / 1000); requestAnimationFrame(frame); }
}
if (!TEST) requestAnimationFrame(frame);
function tick(n) { for (let i = 0; i < n; i++) frame(simNow + 1000 / 60); render(simNow / 1000); }
window.POOL = { play, synth, P, players, wave, ext, tick, editions: () => editions, synthSession }; // handy for tuning in the console
</script>
