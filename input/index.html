<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>pool · input</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .t{position:fixed;color:#fff;font:400 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;pointer-events:none}
  #name{left:16px;bottom:calc(14px + env(safe-area-inset-bottom));opacity:.35}
  #hint{left:0;right:0;top:50%;text-align:center;opacity:0;transition:opacity 1.2s}
  :root{--rim:14px}
  #bar{position:fixed;left:var(--rim);top:var(--rim);height:3px;width:0;background:#ff3b30;pointer-events:none}
  #clock{left:0;right:0;top:calc(var(--rim) + 14px);text-align:center;opacity:0;font-size:12px;color:#fff}
  #clock i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-right:8px;vertical-align:0;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}
  #veil{position:fixed;inset:var(--rim);background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .5s}
  #veil.on{opacity:1;pointer-events:auto}
  #veil span{position:absolute;left:0;right:0;top:16px;text-align:center;color:#fff;opacity:.55;
    font:400 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em}
  #rec{width:46px;height:46px;min-width:0;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center}
  #rec::after{content:"";width:30px;height:30px;border-radius:50%;background:#ff3b30}
  #rec:active::after{transform:scale(.9)}
  #reclabel{margin-top:6px;opacity:.6;font-size:11px;letter-spacing:.2em}
  #panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,calc(100vw - 2 * var(--rim) - 32px));
    box-sizing:border-box;padding:20px 18px 16px;background:rgba(12,12,12,.82);border:1px solid rgba(255,255,255,.14);border-radius:6px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;
    font:400 12px/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-align:center;transition:opacity .4s}
  #panel.off{opacity:0;pointer-events:none}
  #panel.dim{opacity:.12;pointer-events:none}
  #msg{opacity:.75;margin:0 auto 12px;max-width:34em;min-height:1.5em}
  #msg b{font-weight:600;opacity:1}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button,a.btn{appearance:none;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;
    font:inherit;letter-spacing:.12em;padding:12px 18px;border-radius:2px;text-decoration:none;min-width:7em;cursor:pointer}
  button.main{background:#fff;color:#000;border-color:#fff}
  button:disabled{opacity:.35}
  #count{opacity:.45;margin-top:12px;font-size:11px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"><span>replay</span></div>
<div id="bar"></div>
<div class="t" id="clock"></div>
<div class="t" id="hint">touch</div>
<div id="panel"><div id="msg"></div><div class="row" id="btns"></div><div id="count"></div></div>
<script src="../config.js"></script>
<script src="../lib.js"></script>
<script>window.POOL_CONFIG = /*POOL_CONFIG*/null || window.POOL_CONFIG;</script>
<script>
/* ============================================================
   POOL — input.  Lampwrecked.
   A black-and-white lattice. Your hand disturbs it; it settles.
   Record ten seconds of touch and mint it: it joins the pool as
   one of 100 editions, stored on Ethereum as numbers only.
   ============================================================ */

// Settings (contract address, network) live in /config.js
const CFG = window.POOL_CONFIG || {}, LIB = window.POOLLIB;
const chainMode = !!(CFG.contract && LIB);

const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
let W, H, DPR, N, hx, hy, px, py, vx, vy, gap;
let RIM, IW, IH;            // deck width (same rule as the pool) and the drawing area inside it
const border = document.createElement('canvas'), bctx = border.getContext('2d');
function build() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  RIM = Math.max(10 * Math.min(devicePixelRatio || 1, 2), Math.round(0.035 * Math.min(W, H) * Math.min(devicePixelRatio || 1, 2))) / Math.min(devicePixelRatio || 1, 2);
  IW = W - 2 * RIM; IH = H - 2 * RIM;
  document.documentElement.style.setProperty('--rim', RIM + 'px');
  drawBorder();
  gap = Math.max(11, Math.min(18, Math.sqrt(IW * IH / 2200)));
  const cols = Math.ceil(IW / gap) + 1, rows = Math.ceil(IH / gap) + 1;
  const ox = RIM + (IW - (cols - 1) * gap) / 2, oy = RIM + (IH - (rows - 1) * gap) / 2;
  N = cols * rows;
  hx = new Float32Array(N); hy = new Float32Array(N); px = new Float32Array(N); py = new Float32Array(N);
  vx = new Float32Array(N); vy = new Float32Array(N);
  let i = 0;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { hx[i] = px[i] = ox + c * gap; hy[i] = py[i] = oy + r * gap; i++; }
}
// dark tiled deck with a rounded coping at the edge
function drawBorder() {
  border.width = W * DPR; border.height = H * DPR;
  const c = bctx; c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, H);
  c.save(); c.beginPath(); c.rect(0, 0, W, H); c.rect(RIM, RIM, IW, IH); c.clip('evenodd');
  c.fillStyle = '#050505'; c.fillRect(0, 0, W, H);                       // grout
  const ts = RIM * 0.58, g = Math.max(0.6, ts * 0.035);
  for (let y = RIM - Math.ceil(RIM / ts) * ts; y < H; y += ts)
    for (let x = RIM - Math.ceil(RIM / ts) * ts; x < W; x += ts) {
      const v = 0.93 + 0.1 * (Math.sin(x * 12.9898 + y * 78.233) * 43758.5453 % 1 + 1) % 1;
      c.fillStyle = `rgb(${Math.round(38 * v)},${Math.round(40 * v)},${Math.round(42 * v)})`;
      c.fillRect(x + g, y + g, ts - 2 * g, ts - 2 * g);
    }
  // coping: rounded bullnose along the edge
  const cw = RIM * 0.42;
  for (let k = 0; k < cw; k++) {
    const u = k / cw, l = Math.round(22 + 40 * Math.sin(u * Math.PI / 2) - (u < .2 ? 14 * (1 - u / .2) : 0));
    c.strokeStyle = `rgb(${l},${l + 2},${l + 3})`; c.lineWidth = 1.2;
    c.strokeRect(RIM - k - .5, RIM - k - .5, IW + 2 * k + 1, IH + 2 * k + 1);
  }
  c.restore();
}
build(); addEventListener('resize', build);

// ---------- recording ----------
const fingers = new Map();   // pointerId -> {idx, x,y, lx,ly, downAt, lastRec}
let gesture = null;          // {t0, f:[[...]], maxFingers}
const SAMPLE_MS = 33, MAX_MS = 15000, MAX_PTS = 450;
const SESSION_MS = 10000;
// state: 'free' (just playing) · 'armed' (next touch starts the clock) · 'rec' · 'review' · 'mint' · 'done'
let state = 'free', session = null; // session: { t0, strokes:[{t,f}] }

function rec(fg, now, x, y, force) {
  const arr = gesture.f[fg.idx];
  const t = Math.round(now - gesture.t0);
  if (!force && t - fg.lastRec < SAMPLE_MS) return;
  if (arr.length >= MAX_PTS * 3 || t > MAX_MS) return;
  if (session && t > SESSION_MS) return;
  fg.lastRec = t;
  arr.push(t, Math.round(Math.max(0, Math.min(1, (x - RIM) / IW)) * 1000), Math.round(Math.max(0, Math.min(1, (y - RIM) / IH)) * 1000));
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  const now = performance.now();
  if (state === 'review' || state === 'mint' || state === 'done') return;
  if (state === 'armed') startSession(now);
  if (state === 'free') { panel.classList.add('dim'); clearTimeout(undim); }
  if (!gesture) gesture = { t0: session ? session.t0 : now, f: [], maxFingers: 0 };
  if (gesture.f.length >= 5) return;
  const fg = { idx: gesture.f.length, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, downAt: now, lastRec: -1e9 };
  gesture.f.push([]); fingers.set(e.pointerId, fg);
  gesture.maxFingers = Math.max(gesture.maxFingers, fingers.size);
  rec(fg, now, fg.x, fg.y, true);
  pushRadial(fg.x, fg.y, 5.5, 46);
  hideHint();
}, { passive: false });

cv.addEventListener('pointermove', e => {
  const fg = fingers.get(e.pointerId); if (!fg || !gesture) return;
  e.preventDefault();
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (!evs || !evs.length) evs = [e];
  for (const ev of evs) { fg.x = ev.clientX; fg.y = ev.clientY; rec(fg, performance.now(), fg.x, fg.y, false); }
}, { passive: false });

let undim = 0;
function up(e) {
  if (state === 'free') { clearTimeout(undim); undim = setTimeout(() => { if (!fingers.size) panel.classList.remove('dim'); }, 900); }
  const fg = fingers.get(e.pointerId); if (!fg || !gesture) return;
  rec(fg, performance.now(), e.clientX, e.clientY, true);
  fingers.delete(e.pointerId);
  if (fingers.size === 0) { finish(gesture); gesture = null; }
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
// stop iOS from zooming / scrolling / long-press menus
for (const ev of ['gesturestart', 'gesturechange', 'contextmenu', 'touchmove'])
  document.addEventListener(ev, e => e.preventDefault(), { passive: false });

// ---------- what kind of gesture was it? ----------
// 0 tap 1 double 2 hold 3 drag 4 flick 5 swirl 6 pinch 7 rotate 8 two-finger drag 9 multi
function classify(g) {
  const f = g.f.filter(a => a.length >= 3);
  const P = a => ({ n: a.length / 3, t: i => a[i * 3], x: i => a[i * 3 + 1] * IW / 1000, y: i => a[i * 3 + 2] * IH / 1000 });
  if (g.maxFingers >= 3) return 9;
  if (g.maxFingers === 2 && f.length >= 2) {
    const a = P(f[0]), b = P(f[1]);
    const d = (i, j) => Math.hypot(a.x(i) - b.x(j), a.y(i) - b.y(j));
    const d0 = d(0, 0), d1 = d(a.n - 1, b.n - 1);
    const ang = (i, j) => Math.atan2(b.y(j) - a.y(i), b.x(j) - a.x(i));
    let dA = ang(a.n - 1, b.n - 1) - ang(0, 0); while (dA > Math.PI) dA -= 2 * Math.PI; while (dA < -Math.PI) dA += 2 * Math.PI;
    if (Math.abs(dA) > 0.45) return 7;
    if (Math.abs(d1 / Math.max(d0, 1) - 1) > 0.25) return 6;
    return 8;
  }
  const a = P(f[0]); if (!a.n) return 0;
  let len = 0, turn = 0, prevAng = null;
  for (let i = 1; i < a.n; i++) {
    const dx = a.x(i) - a.x(i - 1), dy = a.y(i) - a.y(i - 1), s = Math.hypot(dx, dy); len += s;
    if (s > 2) { const an = Math.atan2(dy, dx); if (prevAng !== null) { let d = an - prevAng; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; turn += d; } prevAng = an; }
  }
  const dur = a.t(a.n - 1);
  if (len < 14) return dur < 320 ? 0 : 2;
  if (Math.abs(turn) > 4.2) return 5;
  // release speed over the last ~100ms
  let k = a.n - 1; while (k > 0 && a.t(a.n - 1) - a.t(k) < 100) k--;
  const sp = Math.hypot(a.x(a.n - 1) - a.x(k), a.y(a.n - 1) - a.y(k)) / Math.max(16, a.t(a.n - 1) - a.t(k));
  if (sp > 1.1 && dur < 700) return 4;
  return 3;
}

function finish(g) {
  const f = g.f.filter(a => a.length >= 3);
  if (!f.length || !session) return;
  // classify on a copy whose clock starts at this stroke
  const start = Math.min(...f.map(a => a[0]));
  const rel = f.map(a => a.map((v, i) => i % 3 === 0 ? v - start : v));
  session.strokes.push({ t: classify({ f: rel, maxFingers: g.maxFingers }), f });
}

// ---------- the 10-second session ----------
const bar = document.getElementById('bar'), clock = document.getElementById('clock');
function startSession(now) {
  session = { t0: now, strokes: [] }; state = 'rec';
  panelOff(); clock.style.opacity = .9; hint.style.opacity = 0;
}
function endSession() {
  if (gesture) { finish(gesture); gesture = null; }
  fingers.clear();
  bar.style.width = '0'; clock.style.opacity = 0;
  const bytes = LIB && LIB.encode(session.strokes, IW / IH);
  if (!bytes) { session = null; show('free', 'nothing was recorded. try again.'); return; }
  session.bytes = bytes;
  state = 'review'; showReview();
  replay();
}
function tickSession(now) {
  if (state !== 'rec') return;
  const t = now - session.t0;
  bar.style.width = Math.min(1, t / SESSION_MS) * IW + 'px';
  clock.innerHTML = '<i></i>rec  ' + Math.max(0, Math.ceil((SESSION_MS - t) / 1000));
  if (t >= SESSION_MS) endSession();
}

// replay the recording on the lattice (and on a pool open in this same browser)
let ghost = null;
let bc = null; try { bc = new BroadcastChannel('pool'); } catch (e) { }
function replay() {
  if (!session || !session.bytes) return;
  ghost = { t0: performance.now(), d: LIB.decode(session.bytes), live: new Map() };
  if (bc) bc.postMessage({ session: Array.from(session.bytes) });
}
function stepGhost(now) {
  if (!ghost || !ghost.d) return;
  const t = now - ghost.t0; let any = false;
  ghost.d.strokes.forEach((st, si) => st.f.forEach((a, fi) => {
    const key = si + ':' + fi, lt = t - st.start, end = a[a.length - 3];
    if (lt < 0 || lt > end + 30) { ghost.live.delete(key); if (lt < 0) any = true; return; }
    any = true;
    let i = 0; while (i + 3 < a.length && a[i + 3] <= lt) i += 3;
    const j = Math.min(i + 3, a.length - 3), span = a[j] - a[i] || 1, u = Math.max(0, Math.min(1, (lt - a[i]) / span));
    const x = RIM + (a[i + 1] + (a[j + 1] - a[i + 1]) * u) / 1000 * IW, y = RIM + (a[i + 2] + (a[j + 2] - a[i + 2]) * u) / 1000 * IH;
    let g = ghost.live.get(key);
    if (!g) { g = { x, y, lx: x, ly: y, downAt: now }; ghost.live.set(key, g); pushRadial(x, y, 5.5, 46); }
    g.x = x; g.y = y; stir(g, now);
  }));
  if (!any) { if (state === 'review' || state === 'mint') ghost.t0 = now + 900; else ghost = null; }   // loop while reviewing
}

// ---------- panel ----------
const panel = document.getElementById('panel'), msg = document.getElementById('msg'), btns = document.getElementById('btns'), countEl = document.getElementById('count');
function panelOff() { panel.classList.add('off'); }
function buttons(list) {
  btns.innerHTML = '';
  for (const [label, fn, main] of list) {
    const b = document.createElement(fn && fn.href ? 'a' : 'button');
    b.textContent = label; if (main) b.className = 'main';
    if (fn && fn.href) { b.href = fn.href; b.className = 'btn'; } else b.onclick = fn;
    btns.appendChild(b);
  }
}
const veil = document.getElementById('veil');
function show(st, text, list) {
  state = st; panel.classList.remove('off', 'dim');
  veil.classList.toggle('on', st === 'review' || st === 'mint' || st === 'done');
  veil.firstElementChild.style.display = st === 'done' ? 'none' : '';
  if (!(st === 'review' || st === 'mint')) ghost = (st === 'done' ? ghost : null);
  msg.innerHTML = text || '';
  if (list) buttons(list); else recordButton();
}
function recordButton() {
  btns.innerHTML = '<div><button id="rec" aria-label="record"></button><div id="reclabel">record</div></div>';
  document.getElementById('rec').onclick = arm;
}
function arm() {
  session = null; ghost = null;
  show('armed', '', []);
  panel.classList.add('off'); hint.textContent = 'touch to begin · ten seconds'; hint.style.opacity = .6;
}
function showReview() {
  const kb = (session.bytes.length / 1024).toFixed(1);
  show('review', `your ten seconds<br><span style="opacity:.6">${session.strokes.length} movement${session.strokes.length === 1 ? '' : 's'} · ${kb}&nbsp;KB</span>`, [
    ['re-record', arm], ['mint', mint, true]]);
}

// ---------- wallet + mint ----------
const pageUrl = location.href.split('#')[0];
function walletLinks() {
  const bare = pageUrl.replace(/^https?:\/\//, '');
  return [['open in MetaMask', { href: 'https://metamask.app.link/dapp/' + bare }],
          ['open in Coinbase Wallet', { href: 'https://go.cb-w.com/dapp?cb_url=' + encodeURIComponent(pageUrl) }]];
}
const chainHex = () => '0x' + (CFG.chainId || 1).toString(16);
// where "see the pool" goes: the hosted pool, or the token's page when this runs from the chain
const hosted = /^https?:$/.test(location.protocol);
function poolLink(id) {
  if (hosted) return { href: '../pool/' + (id ? '?token=' + id : '') };
  const net = CFG.chainId === 11155111 ? 'https://testnets.opensea.io/assets/sepolia/' : 'https://opensea.io/assets/ethereum/';
  return { href: net + (CFG.collection || CFG.contract) + '/' + (id || 1) };
}
let wallet = null; // { eth, from }
async function connect(say) {
  const eth = window.ethereum;
  say('connecting to your wallet…');
  const [from] = await eth.request({ method: 'eth_requestAccounts' });
  if ((await eth.request({ method: 'eth_chainId' })) !== chainHex()) {
    say('switching network…');
    await eth.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: chainHex() }] });
  }
  return (wallet = { eth, from });
}
const ec = data => wallet.eth.request({ method: 'eth_call', params: [{ to: CFG.contract, data }, 'latest'] });
async function send(say, data, value, waiting) {
  const tx = { from: wallet.from, to: CFG.contract, data }; if (value) tx.value = value;
  const hash = await wallet.eth.request({ method: 'eth_sendTransaction', params: [tx] });
  say(waiting);
  let rc = null;
  for (let i = 0; i < 150 && !rc; i++) { await new Promise(r => setTimeout(r, 2000)); rc = await wallet.eth.request({ method: 'eth_getTransactionReceipt', params: [hash] }); }
  if (!rc) throw new Error('still waiting on the network. check your wallet for the transaction.');
  if (rc.status !== '0x1') throw new Error('the transaction failed. nothing changed.');
  return rc;
}
function oops(e, retry) {
  const t = e && e.code === 4001 ? 'cancelled in your wallet.' : ((e && e.message) || String(e));
  show('review', t, [['try again', retry, true], ['back', showReview]]);
}

async function mint() {
  if (!chainMode) { show('review', 'demo mode: no contract is set yet, so this can\'t be minted. it played in the pool if one is open in this browser.', [['re-record', arm]]); return; }
  if (!window.ethereum) { show('review', 'minting needs a wallet. open this page inside your wallet app, then record again there.', [...walletLinks(), ['back', showReview]]); return; }
  const say = t => show('mint', t, []);
  try {
    await connect(say);
    const open = LIB.decUint(await ec('0x' + LIB.SEL.mintOpen));
    const supply = LIB.decUint(await ec('0x' + LIB.SEL.totalSupply));
    const minted = LIB.decUint(await ec(LIB.encAddr(LIB.SEL.hasMinted, wallet.from)));
    const held = LIB.decUintArray(await ec(LIB.encAddr(LIB.SEL.tokensOf, wallet.from)));
    const canMint = open && supply < 100 && !minted;
    const rw = held.map(id => [`rewrite #${id} · 0.01 ETH`, () => rewrite(id)]);
    if (canMint && !held.length) return doMint(say);
    if (canMint) return show('review', `you hold ${held.map(i => '#' + i).join(', ')}. mint a new one, or rewrite one you hold?`,
      [['mint new', () => doMint(say), true], ...rw, ['back', showReview]]);
    if (held.length) return show('review', `${minted ? 'one mint per wallet, ' : ''}but you can rewrite ${held.length === 1 ? 'your gesture' : 'one of yours'}. it keeps its number and its place in the pool.`,
      [...rw, ['back', showReview]]);
    const why = !open ? 'minting isn\'t open yet.' : supply >= 100 ? 'the pool is full: all 100 have been minted.' : 'this wallet has already minted. one each.';
    show('review', why, [['see the pool', poolLink(0)], ['back', showReview]]);
  } catch (e) { oops(e, mint); }
}
async function doMint(say) {
  try {
    say('confirm in your wallet. it\'s free, you only pay network gas.');
    const rc = await send(say, LIB.encMint(session.bytes), null, 'releasing your gesture into the pool… (about 15 seconds)');
    const zero = '0x' + '0'.repeat(64), me = '0x' + wallet.from.replace(/^0x/, '').toLowerCase().padStart(64, '0');
    const log = (rc.logs || []).find(l => l.topics && l.topics[0] === LIB.TRANSFER && l.topics[1] === zero && (l.topics[2] || '').toLowerCase() === me);
    const id = log ? LIB.decUint(log.topics[3]) : 0;
    show('done', `you are <b>#${id}</b> of 100. ${id === 1 ? 'you open every cycle of the pool.' : `you play right after #${id - 1}.`}`,
      [['see yourself in the pool', poolLink(id)]]);
    refreshCount();
  } catch (e) { oops(e, mint); }
}
async function rewrite(id) {
  const say = t => show('mint', t, []);
  try {
    if (!LIB.decUint(await ec('0x' + LIB.SEL.rewriteOpen))) return show('review', 'rewrites are closed right now.', [['back', showReview]]);
    say(`confirm in your wallet: 0.01 ETH plus gas to rewrite #${id}.`);
    await send(say, LIB.encRewrite(id, session.bytes), LIB.REWRITE_WEI, `rewriting #${id}… (about 15 seconds)`);
    show('done', `<b>#${id}</b> is rewritten. the pool now plays your new ten seconds in its place.`, [['see yourself in the pool', poolLink(id)]]);
  } catch (e) { oops(e, () => rewrite(id)); }
}
async function refreshCount() {
  if (!chainMode) { countEl.textContent = 'demo'; return; }
  try { const n = await LIB.totalSupply(); countEl.textContent = n + ' / 100 minted'; if (n >= 100 && state === 'free') show('free', 'all 100 have been minted. holders can still record and rewrite their gesture for 0.01 ETH.'); } catch (e) { }
}

const hint = document.getElementById('hint'); let hinted = false;

function hideHint() { hinted = true; hint.style.opacity = 0; }
show('free', 'press record and you have ten seconds of touch to mint into <b>pool</b>.');
refreshCount();

// ---------- the lattice ----------
function pushRadial(x, y, strength, R) {
  for (let i = 0; i < N; i++) {
    const dx = px[i] - x, dy = py[i] - y, d = Math.hypot(dx, dy);
    if (d < R && d > 0.01) { const f = (1 - d / R) ** 2 * strength; vx[i] += dx / d * f; vy[i] += dy / d * f; }
  }
}
function stir(fg, now) {
  const mvx = fg.x - fg.lx, mvy = fg.y - fg.ly; fg.lx = fg.x; fg.ly = fg.y;
  const sp = Math.hypot(mvx, mvy);
  const R = 58 + Math.min(40, sp * 1.5);
  const still = sp < 0.6, held = now - fg.downAt;
  for (let i = 0; i < N; i++) {
    const dx = px[i] - fg.x, dy = py[i] - fg.y;
    if (dx > R || dx < -R || dy > R || dy < -R) continue;
    const d = Math.hypot(dx, dy); if (d >= R) continue;
    const f = (1 - d / R) ** 2;
    vx[i] += mvx * f * 0.42; vy[i] += mvy * f * 0.42;
    if (still && held > 250) {          // holding: the lattice trembles and slowly turns
      const amp = Math.min(1.6, (held - 250) / 1500) * f;
      vx[i] += (Math.random() - .5) * amp - dy / (d + 1) * amp * 0.35;
      vy[i] += (Math.random() - .5) * amp + dx / (d + 1) * amp * 0.35;
    }
  }
}

const buckets = [[], [], [], []];
const alphas = [0.28, 0.5, 0.75, 1];
function frame(now) {
  tickSession(now); stepGhost(now);
  for (const fg of fingers.values()) stir(fg, now);
  for (const b of buckets) b.length = 0;
  for (let i = 0; i < N; i++) {
    vx[i] += (hx[i] - px[i]) * 0.018; vy[i] += (hy[i] - py[i]) * 0.018;
    vx[i] *= 0.915; vy[i] *= 0.915;
    px[i] += vx[i]; py[i] += vy[i];
    const disp = Math.abs(px[i] - hx[i]) + Math.abs(py[i] - hy[i]) + Math.abs(vx[i]) * 3 + Math.abs(vy[i]) * 3;
    buckets[disp < 1.5 ? 0 : disp < 7 ? 1 : disp < 20 ? 2 : 3].push(i);
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let b = 0; b < 4; b++) {
    ctx.fillStyle = `rgba(255,255,255,${alphas[b]})`;
    const s = 1.3 + b * 0.55, h = s / 2;
    for (const i of buckets[b]) ctx.fillRect(px[i] - h, py[i] - h, s, s);
  }
  ctx.drawImage(border, 0, 0, W, H);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
